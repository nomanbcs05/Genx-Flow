<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StockFlow ERP — Enterprise Inventory &amp; Management Platform</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#2563EB" />
    <meta name="msapplication-TileColor" content="#2563EB" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StockFlow ERP" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-startup-image" href="/icon-512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Cpath d='M6 11l10-5 10 5v10l-10 5-10-5V11z' stroke='white' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3Cpath d='M16 6v20M6 11l10 5 10-5' stroke='white' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- SEO -->
    <meta name="description" content="StockFlow ERP - Enterprise-grade SaaS platform streamlining inventory, sales, finance, and CRM with AI insights for efficient business management." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:title" content="StockFlow ERP" />
    <meta property="og:description" content="Enterprise-grade ERP platform for inventory, sales, finance and CRM." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
      /* Safe area insets for notched phones */
      body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('[SW] Registered:', reg.scope),
            (err) => console.warn('[SW] Registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
